# ==========================================
# Server Configuration
# ==========================================
server.port=8080
spring.application.name=smartfreelance-backend

# ==========================================
# MySQL Database Configuration
# Environment variables DB_URL, DB_USERNAME, DB_PASSWORD can be provided.
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartfreelance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Spring Data JPA & Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Security Configuration
# Environment variable JWT_SECRET must be provided.
# ==========================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Gemini AI Assistant Configuration
# ==========================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

# ==========================================
# Actuator & Observability Configuration
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false
