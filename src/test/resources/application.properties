# ==========================================
# Automated Test Suite Configuration
# ==========================================
server.port=8080
spring.application.name=smartfreelance-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartfreelance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Joy@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=TestJwtSecretKeyForAutomatedUnitTestSuite1234567890!
jwt.expiration=86400000

gemini.api-key=
gemini.model=gemini-2.5-flash

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false
